# Custom PrusaSlicer SLA profile for the Anycubic Photon Mono M7 Max.
#
# Not bundled with PrusaSlicer 2.9.6 -- confirmed by checking this machine's
# own install: resources/profiles/AnycubicSLA.ini only goes up to "Photon
# Mono X 6K", nothing newer. Anycubic's own recommended slicer for this
# printer is Photon Workshop, not PrusaSlicer; PrusaSlicer support for it
# doesn't exist upstream yet. Built by hand from Anycubic's published specs:
#   - 13.6" mono 7K screen, 6480 x 3600 px, 46 micron pixel pitch
#     (6480 x 0.046 = 298.08mm, matches the official 298mm build width)
#   - Build volume 298 x 164 x 300mm
#
# display_mirror_x/y and orientation are COPIED from the bundled Photon
# Mono X 6K profile as a reasonable guess for "how Anycubic wires up their
# panels" -- I could not verify these two against a real M7 Max. If a test
# print comes out mirrored, flip display_mirror_x to 0 (or _y to 1) here.

printer_technology = SLA
bed_shape = 1.48x1.02,299.48x1.02,299.48x165.02,1.48x165.02
display_width = 298
display_height = 164
display_pixels_x = 6480
display_pixels_y = 3600
display_orientation = landscape
display_mirror_x = 1
display_mirror_y = 0
max_print_height = 300

# Print settings -- conservative starting point, not resin-tuned. Treat
# exposure times as a placeholder; get real values from your resin's
# datasheet or Anycubic's M7 Max resin profiles before printing for real.
layer_height = 0.05
faded_layers = 8
min_exposure_time = 1
max_exposure_time = 120
min_initial_exposure_time = 1
max_initial_exposure_time = 300
exposure_time = 2.5
initial_exposure_time = 30
elefant_foot_compensation = 0.2
elefant_foot_min_width = 0.2
printer_correction = 1,1,1
gamma_correction = 1

# Supports -- organic/branching tree supports, matching what main.bat asks
# for via --support-tree-type=branching.
supports_enable = 1
support_tree_type = branching
pad_enable = 1
